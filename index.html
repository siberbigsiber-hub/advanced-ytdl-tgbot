<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Loader</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent2: #34d399;
      --danger: #f87171;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #020817 0%, #111827 100%);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    .card {
      width: min(92vw, 720px);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .header {
      padding: 20px 24px;
      background: linear-gradient(135deg, rgba(56,189,248,0.18), rgba(52,211,153,0.08));
      border-bottom: 1px solid var(--border);
    }

    .title { margin: 0; font-size: 1.5rem; font-weight: 700; }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

    .body { padding: 22px 24px 18px; }

    .upload-box {
      border: 1px dashed rgba(56,189,248,0.7);
      border-radius: 16px;
      background: rgba(15,23,42,0.75);
      padding: 18px;
      margin-bottom: 18px;
    }

    .label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: var(--muted);
    }

    input[type="file"] {
      width: 100%;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.96rem;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }

    .primary {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
    }

    .secondary {
      background: rgba(52,211,153,0.15);
      color: #ddf9ef;
      border: 1px solid rgba(52,211,153,0.25);
    }

    .danger {
      background: rgba(248,113,113,0.15);
      color: #fecaca;
      border: 1px solid rgba(248,113,113,0.25);
    }

    .status {
      margin-top: 18px;
      background: rgba(17,24,39,0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.94rem;
      min-height: 52px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status.success { border-color: rgba(52,211,153,0.5); color: #d1fae5; }
    .status.error { border-color: rgba(248,113,113,0.4); color: #fecaca; }

    .info {
      margin-top: 16px;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">Mini App — Update Cookies</div>
      <div class="subtitle">إدارة ملفات cookies الخاصة بحسابك الشخصي فقط</div>
    </div>

    <div class="body">
      <div class="upload-box">
        <label class="label">اختر ملف cookies.txt</label>
        <input id="fileInput" type="file" accept=".txt" />
        <div class="btn-row">
          <button class="primary" id="uploadBtn">رفع الملف</button>
          <button class="secondary" id="viewBtn">عرض حالة الملف</button>
          <button class="danger" id="clearBtn">حذف الملف</button>
        </div>
      </div>

      <div id="status" class="status">
        لا يوجد ملف حتى الآن. يمكنك رفع ملف cookies الخاص بك.
      </div>

      <div class="info">
        ملاحظات هامة:
        <br />
        - هذا التطبيق مخصص لك فقط
        <br />
        - لا تستخدمه مع حسابات غيرك
        <br />
        - يُشترط أن يكون الملف من متصفحك الشخصي
        <br />
        - إذا انتهت صلاحية cookies، أعد تحميل الملف من هنا
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("fileInput");

    async function setStatus(msg, kind = "") {
      statusEl.textContent = msg;
      statusEl.classList.remove("success", "error");
      if (kind) {
        statusEl.classList.add(kind);
      }
    }

    async function uploadCookies() {
      const file = fileInput.files[0];
      if (!file) {
        setStatus("يرجى اختيار ملف cookies.txt أولاً.", "error");
        return;
      }

      const text = await file.text();
      if (!text || text.trim().length < 20) {
        setStatus("ملف cookies فارغ أو غير صالح.", "error");
        return;
      }

      try {
        const response = await fetch("/upload-cookies", {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: text
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "فشل رفع الملف");
        }

        setStatus(`✅ تم حفظ ملف cookies بنجاح.\nالمسار: ${data.path}`, "success");
      } catch (err) {
        setStatus("❌ " + err.message, "error");
      }
    }

    async function viewStatus() {
      try {
        const response = await fetch("/status-cookies");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ");
        }

        if (data.exists) {
          setStatus(`✅ الملف موجود.\nالمسار: ${data.path}\nالحجم: ${data.size} بايت`, "success");
        } else {
          setStatus("⚠ لا يوجد ملف cookies في السيرفر حاليًا.", "error");
        }
      } catch (err) {
        setStatus("❌ " + err.message, "error");
      }
    }

    async function clearCookies() {
      try {
        const response = await fetch("/clear-cookies", {
          method: "POST"
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ أثناء الحذف");
        }

        setStatus("✅ تم حذف ملف cookies بنجاح.", "success");
      } catch (err) {
        setStatus("❌ " + err.message, "error");
      }
    }

    document.getElementById("uploadBtn").addEventListener("click", uploadCookies);
    document.getElementById("viewBtn").addEventListener("click", viewStatus);
    document.getElementById("clearBtn").addEventListener("click", clearCookies);
  </script>
</body>
</html>
